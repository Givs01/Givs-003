<!doctype html>
<html lang="en-IN" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://pas.org.in; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#082f49">
  <title>Energy Assessment Portal</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="h-full">
  <!-- Progress bar: shown by app.js while the server is being called -->
  <div id="progress" class="fixed inset-x-0 top-16 z-50 h-0.5 overflow-hidden bg-sky-100" hidden>
    <div class="h-full w-1/3 bg-sky-700 animate-indeterminate"></div>
  </div>

  <!-- Instant shell: visible on page load until app.js takes over (no white page) -->
  <div id="app">
    <header class="fixed inset-x-0 top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/95 px-4 sm:px-6">
      <span class="hidden size-9 place-items-center rounded-lg bg-sky-800 sm:grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="size-5 text-sky-400" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"/></svg>
      </span>
      <span class="text-base font-semibold tracking-tight text-sky-950 sm:text-lg">Energy Assessment Portal</span>
    </header>
    <main class="flex min-h-dvh flex-col items-center justify-center gap-3 px-4 pt-16 pb-10" aria-busy="true">
      <span class="inline-block size-8 animate-spin rounded-full border-[3px] border-sky-700 border-r-transparent" aria-hidden="true"></span>
      <p class="text-sm font-medium text-sky-900" role="status">Loading…</p>
    </main>
    <footer class="fixed inset-x-0 bottom-0 z-30 flex h-10 items-center border-t border-slate-200 bg-white/95 px-4 text-xs text-slate-500 sm:px-6">CRDF, CEPT University</footer>
  </div>
  <noscript><p class="px-6 pt-24 text-center text-sm">This portal needs JavaScript switched on.</p></noscript>

  <div id="toast" class="pointer-events-none fixed inset-x-4 bottom-14 z-50 flex justify-center sm:inset-x-auto sm:right-6" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="assets/schema.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
